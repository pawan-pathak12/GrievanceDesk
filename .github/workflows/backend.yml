name: Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "9.0.315"
  CONFIGURATION: Release
  WORKING_DIR: ./backend/SmartCollegeComplaintPortal
  SOLUTION_FILE: ./backend/SmartCollegeComplaintPortal/SmartCollegeComplaintPortal.sln
  API_PROJECT: ./backend/SmartCollegeComplaintPortal/src/SmartCollegeComplaintPortal.API/SmartCollegeComplaintPortal.API.csproj
  PUBLISH_DIR: ./publish

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/**/*.csproj
            backend/**/global.json

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run tests
        if: hashFiles('backend/**/tests/**') != ''
        run: dotnet test "${{ env.SOLUTION_FILE }}" --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

  deploy:
    name: Publish & Deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Validate deployment secrets
        shell: bash
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          missing=()
          [ -z "$AZURE_WEBAPP_NAME" ] && missing+=("AZURE_WEBAPP_NAME")
          [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ] && missing+=("AZURE_WEBAPP_PUBLISH_PROFILE")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions (or the production environment)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/**/*.csproj
            backend/**/global.json

      - name: Restore dependencies
        run: dotnet restore "${{ env.API_PROJECT }}"

      - name: Build API
        run: dotnet build "${{ env.API_PROJECT }}" --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Publish API
        run: dotnet publish "${{ env.API_PROJECT }}" --configuration ${{ env.CONFIGURATION }} --output ${{ env.PUBLISH_DIR }} --no-restore --no-build

      - name: Upload published artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 7

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
